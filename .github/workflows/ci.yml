name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, lint, test, build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The committed PNGs are generated. If the generator and the committed
      # output disagree, the store icons and the repo have already drifted.
      - name: Brand assets are up to date
        run: |
          pnpm run brand
          git diff --exit-code -- public brand

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build both browsers
        run: pnpm run build:all

      # Injected functions are serialised with Function.prototype.toString(), so a
      # stray closure reference only fails at runtime in the page. Catch it here.
      - name: Verify injected functions are self-contained
        run: pnpm run check:injected

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: plainly-chrome
          path: dist

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: plainly-firefox
          path: dist-firefox
